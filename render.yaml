services:
  - type: web
    name: uehg-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JINA_EMBED_MODEL
        value: jina-embeddings-v3
      - key: JINA_EMBED_DIM
        value: "1024"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TIMEOUT
        value: "20"
      - key: RAG_TOP_K
        value: "6"
      - key: RAG_MIN_SCORE
        value: "0.76"
      - key: RAG_MIN_CHUNKS
        value: "2"
      - key: SQL_LIMIT
        value: "6"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: METRICS_ENABLED
        value: "true"
